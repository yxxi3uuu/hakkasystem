<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>學習記錄 - 客語隨拍隨學</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .record-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px;
    }
    .record-stat-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .record-stat-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .record-stat-val { font-size: 20px; font-weight: 800; color: #24465D; }
    .record-stat-lbl { font-size: 11px; color: #888; }

    /* chart */
    .chart-wrap { padding: 8px 16px 16px; }
    .chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 80px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bar { width: 100%; background: #315B78; border-radius: 4px 4px 0 0; min-height: 4px; transition: height 0.4s; }
    .bar-lbl { font-size: 10px; color: #888; }

    /* activity list */
    .activity-item {
      display: flex; align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #f5f5f5;
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-icon {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; margin-right: 12px; flex-shrink: 0;
    }
    .activity-title { font-size: 14px; color: #333; font-weight: 600; }
    .activity-date  { font-size: 12px; color: #aaa; }
    .activity-score { margin-left: auto; font-size: 14px; font-weight: 700; color: #315B78; }
    .activity-date-group {
      padding: 9px 16px 7px;
      border-bottom: 1px solid #edf2f4;
      background: #f6f9fa;
      color: #65767f;
      font-size: 12px;
      font-weight: 700;
    }
    .activity-toggle {
      width: 100%;
      padding: 11px 16px;
      border: 0;
      border-top: 1px solid #f0f0f0;
      background: #fafcfd;
      color: #315B78;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .activity-toggle:hover { background: #f1f6f8; }

    /* category */
    .cat-item { padding: 10px 16px; border-bottom: 1px solid #f5f5f5; }
    .cat-item:last-child { border-bottom: none; padding-bottom: 16px; }
    .cat-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .cat-name { font-size: 14px; color: #333; }
    .cat-pct  { font-size: 13px; font-weight: 600; color: #315B78; }
    .cat-bar  { height: 8px; background: #E8F2F7; border-radius: 4px; overflow: hidden; }
    .cat-fill { height: 100%; background: #315B78; border-radius: 4px; }

    /* weekly achievements */
    .achieve-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid #f5f5f5;
      font-size: 14px; color: #333;
    }
    .achieve-item:last-child { border-bottom: none; padding-bottom: 16px; }
  </style>
  <link rel="stylesheet" href="/static/theme.css" />
</head>
<body>

  <div class="top-bar">
    <span style="font-size:22px;">📊</span>
    <h1>學習記錄</h1>
  </div>

  <a href="/learning" class="section" style="display:flex;align-items:center;gap:14px;padding:18px 20px;text-decoration:none;color:inherit;">
    <span style="width:48px;height:48px;border-radius:14px;background:#E8F2F7;color:#315B78;display:grid;place-items:center;font-size:22px;">🖼️</span>
    <span style="flex:1;min-width:0;">
      <strong style="display:block;font-size:17px;color:#29343A;">我的照片與詞彙</strong>
      <span style="display:block;margin-top:3px;font-size:13px;color:#6F7A80;">查看之前拍攝並收藏的學習內容</span>
    </span>
    <span aria-hidden="true" style="font-size:22px;color:#9AA3A7;">›</span>
  </a>

  <!-- 統計卡片 -->
  <div class="record-stats">
    <div class="record-stat-card">
      <div class="record-stat-icon" style="background:#E8F2F7;">📈</div>
      <div>
        <div class="record-stat-val" id="avgScore">--</div>
        <div class="record-stat-lbl">本週平均</div>
      </div>
    </div>
    <div class="record-stat-card">
      <div class="record-stat-icon" style="background:#E3F2FD;">🔥</div>
      <div>
        <div class="record-stat-val" id="streak">--</div>
        <div class="record-stat-lbl">連續天數</div>
      </div>
    </div>
    <div class="record-stat-card">
      <div class="record-stat-icon" style="background:#FFF3E0;">📚</div>
      <div>
        <div class="record-stat-val" id="vocabCount">--</div>
        <div class="record-stat-lbl">已學詞彙</div>
      </div>
    </div>
    <div class="record-stat-card">
      <div class="record-stat-icon" style="background:#F3E5F5;">✅</div>
      <div>
        <div class="record-stat-val" id="completion">--</div>
        <div class="record-stat-lbl">完成率</div>
      </div>
    </div>
  </div>

  <!-- 本週趨勢 -->
  <div class="section">
    <div class="section-title">📈 本週學習趨勢</div>
    <div class="chart-wrap">
      <div class="chart-bars" id="chartBars"></div>
    </div>
  </div>

  <!-- 最近活動 -->
  <div class="section">
    <div class="section-title">📋 最近活動</div>
    <div id="activityList"></div>
  </div>

  <!-- 需要加強 -->
  <div class="section">
    <div class="section-title">🎯 需要加強的單字</div>
    <div id="categoryList"></div>
  </div>

  <!-- 本週成就 -->
  <div class="section">
    <div class="section-title">🌟 本週成就</div>
    <div id="achieveList"></div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="/"><div class="nav-icon">🏠</div><div class="nav-label">首頁</div></a>
    <a class="nav-item" href="/recognition"><div class="nav-icon">📷</div><div class="nav-label">拍照學習</div></a>
    <a class="nav-item" href="/practice"><div class="nav-icon">🎤</div><div class="nav-label">語音練習</div></a>
    <a class="nav-item" href="/game"><div class="nav-icon">🎮</div><div class="nav-label">配對遊戲</div></a>
    <a class="nav-item active" href="/record"><div class="nav-icon">📊</div><div class="nav-label">學習記錄</div></a>
    <a class="nav-item" href="/profile"><div class="nav-icon">👤</div><div class="nav-label">個人中心</div></a>
  </nav>

  <script src="/static/ui.js"></script>
  <script src="/static/auth.js"></script>
  <script src="/static/notif.js"></script>
  <script>
    const user = requireLogin();
    initNotif();
    if (user) {
      const USER_ID = user.id;
      const DAYS = ['週一','週二','週三','週四','週五','週六','週日'];

      // 圖表與活動列表
      async function loadRecords() {
        try {
          // 統計與總覽
          const profile = await fetch(`/api/profile/${USER_ID}`).then(r => r.json());
          document.getElementById('avgScore').textContent   = profile.avg_score + '分';
          document.getElementById('streak').textContent     = profile.study_days + '天';
          document.getElementById('vocabCount').textContent = profile.vocab_learned + '個';

          // 紀錄與活動
          const records = await fetch(`/api/profile/${USER_ID}/records`).then(r => r.json());

          const scores = records.weekly_scores || [0,0,0,0,0,0,0];
          const max = Math.max(...scores, 100);
          document.getElementById('chartBars').innerHTML = scores.map((s, i) => `
            <div class="bar-col">
              <div class="bar" style="height:${(s/max)*70}px;opacity:${i===6?1:0.6+i*0.06}"></div>
              <div class="bar-lbl">${DAYS[i]}</div>
            </div>
          `).join('');

          const activities = records.recent_activities || [];
          const activityList = document.getElementById('activityList');
          const activityPageSize = 4;

          function activityDateLabel(dateValue) {
            const dateText = String(dateValue || '').slice(0, 10);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            const localDateText = date => [
              date.getFullYear(),
              String(date.getMonth() + 1).padStart(2, '0'),
              String(date.getDate()).padStart(2, '0')
            ].join('-');

            if (dateText === localDateText(today)) return '今天';
            if (dateText === localDateText(yesterday)) return '昨天';
            if (!dateText) return '日期未記錄';

            const [year, month, day] = dateText.split('-');
            return `${year} 年 ${Number(month)} 月 ${Number(day)} 日`;
          }

          function renderActivities(expanded = false) {
            if (activities.length === 0) {
              activityList.innerHTML = '<div class="empty-state">還沒有學習紀錄，拍下第一個物品開始學客語吧！<br><a class="btn btn-primary" href="/recognition" style="display:inline-flex;margin-top:16px;text-decoration:none;">📷 開始拍照</a></div>';
              return;
            }

            const visibleActivities = expanded
              ? activities
              : activities.slice(0, activityPageSize);
            let previousDate = '';
            activityList.innerHTML = visibleActivities.map(a => {
              const activityDate = String(a.date || '').slice(0, 10);
              const dateHeader = activityDate !== previousDate
                ? `<div class="activity-date-group">${activityDateLabel(a.date)}</div>`
                : '';
              previousDate = activityDate;
              return `${dateHeader}
                <div class="activity-item">
                  <div class="activity-icon" style="background:#E8F2F7">${a.icon}</div>
                  <div>
                    <div class="activity-title">${a.title}</div>
                  </div>
                  <div class="activity-score">${a.score > 0 ? a.score + '分' : ''}</div>
                </div>`;
            }).join('');

            if (activities.length > activityPageSize) {
              activityList.insertAdjacentHTML('beforeend', `
                <button type="button" class="activity-toggle" aria-expanded="${expanded}">
                  ${expanded ? '收合活動紀錄 ▲' : `展開其餘 ${activities.length - activityPageSize} 筆活動 ▼`}
                </button>`);
              activityList.querySelector('.activity-toggle').addEventListener('click', () => {
                renderActivities(!expanded);
              });
            }
          }

          renderActivities();

          // ── 低於 80 分的語音練習單字（同一單字彙整顯示）────────
          const weakWords = records.weak_words || [];
          if (weakWords.length === 0) {
            document.getElementById('categoryList').innerHTML =
              '<div class="empty-state">目前沒有需要加強的單字，繼續保持！</div>';
          } else {
            document.getElementById('categoryList').innerHTML = weakWords.map(item => `
              <div class="cat-item">
                <div class="cat-header">
                  <span class="cat-name">📝 ${item.word}</span>
                  <span class="cat-pct">平均 ${item.average_score} 分・${item.attempts} 次</span>
                </div>
                <div class="cat-bar"><div class="cat-fill" style="width:${item.average_score}%"></div></div>
              </div>`).join('');
          }

          // ── 本週目標完成率（動態）────────────────────────────
          const goals = await fetch(`/api/profile/${USER_ID}/weekly-goals`).then(r => r.json());
          const totalGoals     = goals.length;
          const completedGoals = goals.filter(g => g.current >= g.target).length;
          const overallPct     = totalGoals > 0 ? Math.round(completedGoals / totalGoals * 100) : 0;

          // 完成率卡片
          document.getElementById('completion').textContent = overallPct + '%';

          document.getElementById('achieveList').innerHTML = goals.length === 0
            ? '<div style="padding:16px;color:#888;text-align:center;">尚無目標資料</div>'
            : goals.map(g => {
                const pct  = Math.min(100, Math.round(g.current / g.target * 100));
                const done = g.current >= g.target;
                return `
                  <div style="padding:10px 16px;border-bottom:1px solid #f5f5f5;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                      <span style="font-size:14px;color:#333;">${done ? '✅' : '🔲'} ${g.title}</span>
                      <span style="font-size:13px;font-weight:700;color:${done?'#315B78':'#888'};">${g.current}／${g.target}（${pct}%）</span>
                    </div>
                    <div class="cat-bar"><div class="cat-fill" style="width:${pct}%;background:${done?'#315B78':'#91B1C3'};"></div></div>
                  </div>`;
              }).join('') + `
              <div style="padding:12px 16px;text-align:center;font-size:13px;color:#555;">
                本週整體完成率：<strong style="color:#24465D;font-size:16px;">${overallPct}%</strong>
                （${completedGoals}／${totalGoals} 項目標達成）
              </div>`;

        } catch(e) {
          console.error("載入紀錄失敗", e);
          document.getElementById('activityList').innerHTML = '<div class="empty-state">目前暫時無法載入學習紀錄，請稍後再試。</div>';
          document.getElementById('categoryList').innerHTML = '<div class="empty-state">加強建議稍後就會回來。</div>';
        }
      }

      loadRecords();
    }
  </script>
</body>
</html>
