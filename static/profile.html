<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個人中心 - 客語隨拍隨學</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    /* ── 頂部用戶區 ── */
    .profile-header {
      background: linear-gradient(135deg, #315B78 0%, #24465D 100%);
      color: white;
      padding: 40px 20px 30px;
      text-align: center;
    }
    .app-title {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 12px;
      border: 3px solid rgba(255,255,255,0.6);
    }
    .user-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .user-subtitle {
      font-size: 13px;
      opacity: 0.8;
    }

    /* ── 統計卡片 ── */
    .stats-row {
      display: flex;
      background: white;
      border-radius: 16px;
      margin: -20px 16px 0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .stat-item {
      flex: 1;
      text-align: center;
      padding: 18px 8px;
      border-right: 1px solid #f0f0f0;
    }
    .stat-item:last-child { border-right: none; }
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #24465D;
    }
    .stat-label {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }

    /* ── 通用 section ── */
    .section {
      background: white;
      border-radius: 16px;
      margin: 16px;
      overflow: hidden;
    }
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: #333;
      padding: 16px 16px 8px;
    }

    /* ── 選單列表 ── */
    .menu-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #f5f5f5;
      cursor: pointer;
      transition: background 0.15s;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: #f9f9f9; }
    .menu-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 12px;
    }
    .menu-icon.blue-soft  { background: #E8F2F7; }
    .menu-icon.blue   { background: #E3F2FD; }
    .menu-icon.orange { background: #FFF3E0; }
    .menu-icon.red    { background: #FFEBEE; }
    .menu-text { flex: 1; font-size: 15px; color: #333; }
    .menu-arrow { color: #ccc; font-size: 18px; }

    /* ── 成就徽章 ── */
    .achievements-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 8px 16px 16px;
    }
    .badge {
      text-align: center;
      padding: 12px 8px;
      border-radius: 12px;
      background: #f9f9f9;
    }
    .badge.unlocked { background: #E8F2F7; }
    .badge-icon { font-size: 28px; margin-bottom: 6px; }
    .badge-name { font-size: 12px; font-weight: 600; color: #333; }
    .badge-desc { font-size: 10px; color: #888; margin-top: 2px; line-height: 1.3; }
    .badge.locked .badge-icon { filter: grayscale(1); opacity: 0.4; }
    .badge.locked .badge-name { color: #aaa; }

    /* ── 本週目標 ── */
    .goal-item {
      padding: 12px 16px;
      border-bottom: 1px solid #f5f5f5;
    }
    .goal-item:last-child { border-bottom: none; padding-bottom: 16px; }
    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .goal-title { font-size: 14px; color: #333; }
    .goal-progress-text { font-size: 13px; font-weight: 600; color: #315B78; }
    .progress-bar {
      height: 8px;
      background: #E8F2F7;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #315B78, #6F95AC);
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    /* ── 底部導覽列 ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      padding: 8px 0 12px;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      text-decoration: none;
      color: #aaa;
      transition: color 0.15s;
    }
    .nav-item.active { color: #315B78; }
    .nav-item:hover { color: #315B78; }
    .nav-icon { font-size: 22px; }
    .nav-label { font-size: 10px; }
  </style>
  <link rel="stylesheet" href="/static/theme.css" />
</head>
<body>

  <!-- 頂部用戶資訊 -->
  <div class="profile-header">
    <div class="app-title">🎓 客語隨拍隨學</div>
    <div class="avatar">👤</div>
    <div class="user-name" id="userName">載入中...</div>
    <div class="user-subtitle" id="userSubtitle">已學習 -- 天</div>
  </div>

  <!-- 統計卡片 -->
  <div class="stats-row">
    <div class="stat-item">
      <div class="stat-value" id="statVocab">--</div>
      <div class="stat-label">已學詞彙</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="statScore">--</div>
      <div class="stat-label">平均分數</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="statDays">--</div>
      <div class="stat-label">學習天數</div>
    </div>
  </div>

  <!-- 選單 -->
  <div class="section" style="margin-top: 32px;">
    <div class="menu-item" onclick="openSheet('settings')">
      <div class="menu-icon blue-soft">⚙️</div>
      <span class="menu-text">設定</span>
      <span class="menu-arrow">›</span>
    </div>
    <div class="menu-item" onclick="openSheet('notif')">
      <div class="menu-icon blue">🔔</div>
      <span class="menu-text">通知設定</span>
      <span class="menu-arrow">›</span>
    </div>
    <div class="menu-item" onclick="openSheet('guide')">
      <div class="menu-icon orange">📖</div>
      <span class="menu-text">使用說明</span>
      <span class="menu-arrow">›</span>
    </div>
    <div class="menu-item" id="logoutBtn">
      <div class="menu-icon red">🚪</div>
      <span class="menu-text">登出</span>
      <span class="menu-arrow">›</span>
    </div>
  </div>

  <!-- 管理後台入口（老師/管理者限定，由 JS 動態顯示） -->
  <div class="section" id="adminSection" style="display:none;">
    <a href="/admin" style="text-decoration:none;">
      <div class="menu-item">
        <div class="menu-icon" style="background:#E8F2F7;">🛡️</div>
        <span class="menu-text" style="font-weight:700;color:#24465D;">管理後台</span>
        <span class="menu-arrow" style="color:#315B78;">›</span>
      </div>
    </a>
  </div>

  <!-- 成就徽章 -->
  <div class="section">
    <div class="section-title">🏆 成就徽章</div>
    <div class="achievements-grid" id="achievementsGrid">
      <!-- 由 JS 動態填入 -->
    </div>
  </div>

  <!-- 本週目標 -->
  <div class="section">
    <div class="section-title">💪 本週目標</div>
    <div id="weeklyGoals">
      <!-- 由 JS 動態填入 -->
    </div>
  </div>

  <!-- 底部導覽列 -->
  <nav class="bottom-nav">
    <a class="nav-item" href="/"><div class="nav-icon">🏠</div><div class="nav-label">首頁</div></a>
    <a class="nav-item" href="/recognition"><div class="nav-icon">📷</div><div class="nav-label">拍照學習</div></a>
    <a class="nav-item" href="/practice"><div class="nav-icon">🎤</div><div class="nav-label">語音練習</div></a>
    <a class="nav-item" href="/game"><div class="nav-icon">🎮</div><div class="nav-label">配對遊戲</div></a>
    <a class="nav-item" href="/record"><div class="nav-icon">📊</div><div class="nav-label">學習記錄</div></a>
    <a class="nav-item active" href="/profile"><div class="nav-icon">👤</div><div class="nav-label">個人中心</div></a>
  </nav>

  <script src="/static/ui.js"></script>
  <script src="/static/auth.js"></script>
  <script src="/static/notif.js"></script>
  <script>
    const user = requireLogin();
    initNotif();
    if (user) {
      const USER_ID = user.id;

      // 老師/管理者才顯示管理後台入口
      if (user.role === 'teacher' || user.role === 'admin') {
        document.getElementById('adminSection').style.display = '';
      }

      async function loadProfile() {
        try {
          const [profile, achievements, goals] = await Promise.all([
            fetch(`/api/profile/${USER_ID}`).then(r => r.json()),
            fetch(`/api/profile/${USER_ID}/achievements`).then(r => r.json()),
            fetch(`/api/profile/${USER_ID}/weekly-goals`).then(r => r.json()),
          ]);

          document.getElementById('userName').textContent = profile.name;
          document.getElementById('userSubtitle').textContent = `已學習 ${profile.study_days} 天`;
          document.getElementById('statVocab').textContent = profile.vocab_learned;
          document.getElementById('statScore').textContent = profile.avg_score;
          document.getElementById('statDays').textContent = profile.study_days;

          const grid = document.getElementById('achievementsGrid');
          grid.innerHTML = achievements.map(a => `
            <div class="badge ${a.unlocked ? 'unlocked' : 'locked'}">
              <div class="badge-icon">${a.icon}</div>
              <div class="badge-name">${a.name}</div>
              <div class="badge-desc">${a.description || ''}</div>
            </div>
          `).join('');

          const goalsEl = document.getElementById('weeklyGoals');
          goalsEl.innerHTML = goals.map(g => {
            const pct = Math.min(100, Math.round((g.current / g.target) * 100));
            return `
              <div class="goal-item">
                <div class="goal-header">
                  <span class="goal-title">${g.title}</span>
                  <span class="goal-progress-text">${g.current}/${g.target}</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill" style="width:${pct}%"></div>
                </div>
              </div>
            `;
          }).join('');
        } catch (err) {
          console.error('載入失敗', err);
        }
      }

      document.getElementById('logoutBtn').addEventListener('click', () => logout());
      loadProfile();
    }
  </script>

  <!-- ── 彈窗 ─────────────────────────────────────────── -->
  <div id="sheetOverlay" onclick="closeSheet()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:flex-end;justify-content:center;">
    <div id="sheetContent" onclick="event.stopPropagation()" style="background:white;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:24px 20px 48px;animation:slideUp .25s ease;">
      <div style="width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 20px;"></div>
      <div id="sheetBody"></div>
      <button onclick="closeSheet()" style="display:block;width:100%;margin-top:20px;padding:12px;background:#f0f0f0;color:#555;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;">關閉</button>
    </div>
  </div>

  <style>
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    #sheetOverlay.open{display:flex!important}
    .sheet-title{font-size:18px;font-weight:800;color:#24465D;margin-bottom:4px}
    .sheet-sub{font-size:13px;color:#888;margin-bottom:20px}
    .setting-section{margin-bottom:20px}
    .setting-label{font-size:12px;color:#888;font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
    .setting-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
    .setting-row label{font-size:13px;color:#555;font-weight:600}
    .setting-row input{padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;outline:none}
    .setting-row input:focus{border-color:#315B78}
    .setting-btn{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:13px 20px;border:none;border-radius:15px;background:#24465D;color:white;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;box-shadow:0 6px 15px rgba(36,70,93,.18);transition:transform 180ms ease,box-shadow 180ms ease,background 180ms ease}
    .setting-btn:hover{background:#315B78}
    .setting-btn:active{transform:scale(.98)}
    .info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f5;font-size:13px}
    .info-row:last-child{border-bottom:none}
    .info-label{color:#888}
    .info-value{color:#333;font-weight:600}
    .guide-step{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start}
    .guide-step .step-num{min-width:28px;height:28px;background:#E8F2F7;color:#24465D;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
    .guide-step .step-text{font-size:14px;color:#444;line-height:1.6}
    .guide-section-title{font-size:15px;font-weight:700;color:#333;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid #E8F2F7}
  </style>

  <script>
    function openSheet(type) {
      const role = (getUser() || {}).role || 'student';
      const body = document.getElementById('sheetBody');
      if (type === 'settings') body.innerHTML = buildSettings(role);
      if (type === 'guide')    body.innerHTML = buildGuide(role);
      if (type === 'notif')    body.innerHTML = buildNotif(role);
      document.getElementById('sheetOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeSheet() {
      document.getElementById('sheetOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    // ── 設定內容 ──────────────────────────────────────────
    function buildSettings(role) {
      const roleLabel = {admin:'超級管理者',teacher:'老師',student:'學生'}[role] || role;
      const user = getUser();
      let html = `
        <div class="sheet-title">⚙️ 設定</div>
        <div class="sheet-sub">目前身份：${roleLabel}</div>
        <div class="setting-section">
          <div class="setting-label">帳號資訊</div>
          <div class="info-row"><span class="info-label">姓名</span><span class="info-value" id="infoName">${user?.name||'—'}</span></div>
          <div class="info-row"><span class="info-label">Email</span><span class="info-value">${user?.email||'—'}</span></div>
          <div class="info-row"><span class="info-label">角色</span><span class="info-value">${roleLabel}</span></div>
        </div>
        <div class="setting-section">
          <div class="setting-label">修改個人資料</div>
          <div class="setting-row"><label>新名稱</label><input type="text" id="newName" placeholder="輸入新名稱" /></div>
          <div class="setting-row"><label>新密碼</label><input type="password" id="newPw" placeholder="輸入新密碼（至少 6 位）" /></div>
          <div class="setting-row"><label>確認新密碼</label><input type="password" id="newPw2" placeholder="再次輸入新密碼" /></div>
          <button class="setting-btn" onclick="saveSettings()">儲存變更</button>
          <div id="settingMsg" style="text-align:center;margin-top:10px;font-size:13px;color:#315B78;display:none;"></div>
        </div>`;

      if (role === 'admin' || role === 'teacher') {
        html += `
        <div class="setting-section">
          <div class="setting-label">系統資訊（唯讀）</div>
          <div class="info-row"><span class="info-label">資料庫</span><span class="info-value">PostgreSQL 15</span></div>
          <div class="info-row"><span class="info-label">後端框架</span><span class="info-value">FastAPI + SQLAlchemy</span></div>
          <div class="info-row"><span class="info-label">圖像辨識</span><span class="info-value">YOLOv11 + Gemini</span></div>
          <div class="info-row"><span class="info-label">語音合成</span><span class="info-value">客語 TTS API</span></div>
        </div>`;
      }
      if (role === 'admin') {
        html += `
        <div class="setting-section">
          <div class="setting-label">管理者專屬資訊</div>
          <div class="info-row"><span class="info-label">管理後台</span><span class="info-value"><a href="/admin" style="color:#315B78">前往後台</a></span></div>
          <div class="info-row"><span class="info-label">預設密碼</span><span class="info-value">Hakka2026</span></div>
          <div class="info-row"><span class="info-label">角色說明</span><span class="info-value">admin / teacher / student</span></div>
        </div>`;
      }
      html += '</div>';
      return html;
    }

    async function saveSettings() {
      const user = getUser();
      if (!user) return;
      const newName = document.getElementById('newName').value.trim();
      const newPw   = document.getElementById('newPw').value;
      const newPw2  = document.getElementById('newPw2').value;
      const msg = document.getElementById('settingMsg');
      msg.style.display = 'none';

      if (newPw && newPw !== newPw2) {
        msg.textContent = '兩次密碼不一致'; msg.style.color = '#e53935'; msg.style.display = 'block'; return;
      }
      if (newPw && newPw.length < 6) {
        msg.textContent = '密碼至少需要 6 位'; msg.style.color = '#e53935'; msg.style.display = 'block'; return;
      }
      try {
        if (newPw) {
          const r = await fetch('/api/auth/reset-password', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ email: user.email, new_password: newPw })
          });
          if (!r.ok) { const d = await r.json(); msg.textContent = d.detail||'密碼更新失敗'; msg.style.color='#e53935'; msg.style.display='block'; return; }
        }
        if (newName) {
          localStorage.setItem('user_name', newName);
          document.getElementById('userName').textContent = newName;
          document.getElementById('infoName').textContent = newName;
        }
        msg.textContent = '已儲存！'; msg.style.color = '#315B78'; msg.style.display = 'block';
        document.getElementById('newName').value = '';
        document.getElementById('newPw').value = '';
        document.getElementById('newPw2').value = '';
      } catch(e) { msg.textContent = '網路錯誤'; msg.style.color='#e53935'; msg.style.display='block'; }
    }

    // ── 使用說明內容 ──────────────────────────────────────
    function buildGuide(role) {
      const guides = {
        admin: `
          <div class="sheet-title">📖 管理者使用說明</div>
          <div class="sheet-sub">超級管理者功能總覽</div>
          <div class="guide-section-title">🛡️ 管理後台</div>
          <div class="guide-step"><div class="step-num">1</div><div class="step-text">從個人中心點擊「管理後台」進入後台介面。</div></div>
          <div class="guide-step"><div class="step-num">2</div><div class="step-text">在「所有使用者」頁籤可查看所有帳號，並透過下拉選單切換角色（學生 / 老師 / 管理者）。</div></div>
          <div class="guide-step"><div class="step-num">3</div><div class="step-text">在「班級管理」建立班級，填入班級名稱與說明後點擊建立。</div></div>
          <div class="guide-step"><div class="step-num">4</div><div class="step-text">點「指派老師」為班級分配老師；老師登入後只會看到自己的班級。</div></div>
          <div class="guide-section-title">👥 學生管理</div>
          <div class="guide-step"><div class="step-num">5</div><div class="step-text">在班級頁面輸入學生 Email 將學生加入班級，也可點「詳細」查看學生的儲存單字與學習記錄。</div></div>
          <div class="guide-section-title">🔑 帳號管理</div>
          <div class="guide-step"><div class="step-num">6</div><div class="step-text">新老師帳號預設密碼為 Hakka2026，請通知老師登入後自行到設定修改密碼。</div></div>`,

        teacher: `
          <div class="sheet-title">📖 老師使用說明</div>
          <div class="sheet-sub">班級管理與學生追蹤</div>
          <div class="guide-section-title">🏫 查看班級</div>
          <div class="guide-step"><div class="step-num">1</div><div class="step-text">從個人中心點擊「管理後台」，進入後會看到你被分配的班級。</div></div>
          <div class="guide-step"><div class="step-num">2</div><div class="step-text">點「查看學生」進入班級學生名單，可查看每位學生的單字數、活動次數、平均分數。</div></div>
          <div class="guide-step"><div class="step-num">3</div><div class="step-text">點學生旁的「詳細」可查看該學生儲存的單字（含圖片與音檔）及完整學習記錄。</div></div>
          <div class="guide-section-title">➕ 新增學生</div>
          <div class="guide-step"><div class="step-num">4</div><div class="step-text">在班級頁面輸入學生的 Email 點「加入」，即可將學生加入班級（學生須先完成註冊）。</div></div>
          <div class="guide-section-title">💡 注意事項</div>
          <div class="guide-step"><div class="step-num">5</div><div class="step-text">老師只能查看自己班級的學生，無法看到其他班級的資料。</div></div>`,

        student: `
          <div class="sheet-title">📖 學生使用說明</div>
          <div class="sheet-sub">客語隨拍隨學功能導覽</div>
          <div class="guide-section-title">📷 拍照學習</div>
          <div class="guide-step"><div class="step-num">1</div><div class="step-text">點選底部導覽列的「拍照學習」，上傳或拍攝一張圖片。</div></div>
          <div class="guide-step"><div class="step-num">2</div><div class="step-text">系統自動辨識圖片中的物品，並翻譯成客語、生成例句與發音。</div></div>
          <div class="guide-step"><div class="step-num">3</div><div class="step-text">點「儲存單字」可將學習結果存入「我的學習」，方便複習。</div></div>
          <div class="guide-section-title">🎤 語音練習</div>
          <div class="guide-step"><div class="step-num">4</div><div class="step-text">前往「語音練習」，跟著系統發音，完成後系統會給出評分與建議。</div></div>
          <div class="guide-section-title">🎮 配對遊戲</div>
          <div class="guide-step"><div class="step-num">5</div><div class="step-text">在「配對遊戲」中用已學單字進行圖文配對，用遊戲方式加強記憶。</div></div>
          <div class="guide-section-title">📊 學習記錄</div>
          <div class="guide-step"><div class="step-num">6</div><div class="step-text">「學習記錄」頁面可查看你的練習分數走勢與最近活動記錄。</div></div>`
      };
      return (guides[role] || guides.student) + '</div>';
    }

    // ── 通知設定內容 ──────────────────────────────────────
    function buildNotif(role) {
      const roleLabel = {admin:'超級管理者',teacher:'老師',student:'學生'}[role] || role;
      const notifEnabled = localStorage.getItem('notif_enabled') !== 'false';
      const notifSound   = localStorage.getItem('notif_sound')   !== 'false';

      // 共用：開關切換樣式
      const toggle = (id, checked, onchange) =>
        `<label style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f5f5f5;cursor:pointer;">
          <span style="font-size:14px;color:#333;">${id === 'toggleNotif' ? '接收通知' : id === 'toggleSound' ? '通知音效' : id}</span>
          <input type="checkbox" id="${id}" ${checked?'checked':''} onchange="${onchange}" style="width:18px;height:18px;accent-color:#315B78;cursor:pointer;" />
        </label>`;

      let html = `
        <div class="sheet-title">🔔 通知設定</div>
        <div class="sheet-sub">身份：${roleLabel}</div>
        <div class="setting-section">
          <div class="setting-label">一般設定</div>
          ${toggle('toggleNotif', notifEnabled, "saveNotifPref('notif_enabled', this.checked)")}
          ${toggle('toggleSound',  notifSound,   "saveNotifPref('notif_sound',   this.checked)")}
        </div>
        <div class="setting-section">
          <div class="setting-label">通知紀錄</div>
          <div id="notifPreviewList"><div class="loading-tip" style="padding:16px 0;">載入中...</div></div>
          <button onclick="clearAllNotif()" style="width:100%;margin-top:12px;padding:10px;border:none;border-radius:10px;background:#FFEBEE;color:#D32F2F;font-size:13px;font-weight:600;cursor:pointer;">🗑️ 清除所有通知</button>
        </div>`;

      // teacher 專屬：快速發通知給班級
      if (role === 'teacher' || role === 'admin') {
        html += `
        <div class="setting-section">
          <div class="setting-label">${role === 'admin' ? '管理者' : '老師'}專屬 — 快速發通知</div>
          <div id="quickNotifClasses"><div class="loading-tip" style="padding:8px 0;">載入班級中...</div></div>
          <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
            <input type="text" id="quickNotifTitle" placeholder="通知標題（必填）" style="padding:9px 12px;border:1px solid #ddd;border-radius:10px;font-size:13px;outline:none;" />
            <input type="text" id="quickNotifBody"  placeholder="通知內容（選填）" style="padding:9px 12px;border:1px solid #ddd;border-radius:10px;font-size:13px;outline:none;" />
            <button onclick="sendQuickNotif()" style="padding:10px;border:none;border-radius:10px;background:#315B78;color:white;font-size:13px;font-weight:600;cursor:pointer;">📣 發送給所選班級</button>
            <div id="quickNotifMsg" style="font-size:12px;text-align:center;display:none;"></div>
          </div>
        </div>`;
      }

      // admin 專屬：廣播
      if (role === 'admin') {
        html += `
        <div class="setting-section">
          <div class="setting-label">管理者專屬 — 全系統廣播</div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <input type="text" id="broadcastTitle2" placeholder="廣播標題（必填）" style="padding:9px 12px;border:1px solid #ddd;border-radius:10px;font-size:13px;outline:none;" />
            <input type="text" id="broadcastBody2"  placeholder="廣播內容（選填）" style="padding:9px 12px;border:1px solid #ddd;border-radius:10px;font-size:13px;outline:none;" />
            <button onclick="sendBroadcast2()" style="padding:10px;border:none;border-radius:10px;background:#E65100;color:white;font-size:13px;font-weight:600;cursor:pointer;">📢 廣播給所有人</button>
            <div id="broadcastMsg2" style="font-size:12px;text-align:center;display:none;"></div>
          </div>
        </div>`;
      }

      html += '</div>';
      // 載入通知紀錄和班級清單（在 DOM 渲染後執行）
      setTimeout(() => {
        loadNotifPreview();
        if (role === 'teacher' || role === 'admin') loadQuickNotifClasses();
      }, 50);
      return html;
    }

    function saveNotifPref(key, val) {
      localStorage.setItem(key, val);
      // 同步更新鈴鐺行為
      if (key === 'notif_enabled' && typeof refreshUnreadCount === 'function') {
        if (!val) {
          const badge = document.getElementById('notifBadge');
          if (badge) badge.classList.remove('show');
        } else {
          refreshUnreadCount();
        }
      }
    }

    async function loadNotifPreview() {
      const user = getUser();
      const el = document.getElementById('notifPreviewList');
      if (!el || !user) return;
      try {
        const notifs = await fetch(`/api/notifications?user_id=${user.id}`).then(r => r.json());
        if (!notifs.length) { el.innerHTML = '<div style="font-size:13px;color:#bbb;padding:8px 0;">目前沒有通知</div>'; return; }
        el.innerHTML = notifs.slice(0, 5).map(n => `
          <div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5;align-items:flex-start;">
            <div style="min-width:8px;height:8px;background:${n.is_read?'#ddd':'#315B78'};border-radius:50%;margin-top:5px;"></div>
            <div style="flex:1;">
              <div style="font-size:13px;font-weight:600;color:#333;">${n.title}</div>
              ${n.body?`<div style="font-size:12px;color:#888;">${n.body}</div>`:''}
              <div style="font-size:11px;color:#bbb;">${n.created_at}</div>
            </div>
          </div>`).join('') +
          (notifs.length > 5 ? `<div style="font-size:12px;color:#888;text-align:center;margin-top:8px;">還有 ${notifs.length-5} 則通知，點鈴鐺查看全部</div>` : '');
      } catch(e) { el.innerHTML = '<div style="font-size:13px;color:#bbb;">載入失敗</div>'; }
    }

    async function clearAllNotif() {
      const user = getUser();
      if (!user || !confirm('確定清除所有通知？')) return;
      const notifs = await fetch(`/api/notifications?user_id=${user.id}`).then(r => r.json());
      await Promise.all(notifs.map(n => fetch(`/api/notifications/${n.id}?user_id=${user.id}`, {method:'DELETE'})));
      loadNotifPreview();
      if (typeof refreshUnreadCount === 'function') refreshUnreadCount();
    }

    async function loadQuickNotifClasses() {
      const user = getUser();
      const el = document.getElementById('quickNotifClasses');
      if (!el || !user) return;
      try {
        const classes = await fetch(`/api/admin/classes?admin_id=${user.id}`).then(r => r.json());
        if (!classes.length) { el.innerHTML = '<div style="font-size:13px;color:#bbb;">尚未分配班級</div>'; return; }
        el.innerHTML = `<select id="quickNotifClassId" style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:10px;font-size:13px;outline:none;">
          ${classes.map(c => `<option value="${c.id}">${c.name}（${c.student_count} 人）</option>`).join('')}
        </select>`;
      } catch(e) { el.innerHTML = '<div style="font-size:13px;color:#bbb;">載入失敗</div>'; }
    }

    async function sendQuickNotif() {
      const user = getUser();
      const title = document.getElementById('quickNotifTitle')?.value.trim();
      const body  = document.getElementById('quickNotifBody')?.value.trim();
      const classId = parseInt(document.getElementById('quickNotifClassId')?.value || '0');
      const msg = document.getElementById('quickNotifMsg');
      if (!title) { msg.textContent = '請填寫通知標題'; msg.style.color='#e53935'; msg.style.display='block'; return; }
      try {
        const res = await fetch('/api/notifications/send', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({sender_id:user.id, title, body:body||'', target:'class', class_id:classId})
        });
        const data = await res.json();
        if (!res.ok) { msg.textContent = data.detail||'發送失敗'; msg.style.color='#e53935'; msg.style.display='block'; return; }
        msg.textContent = `✅ 已發送給 ${data.sent_to} 位學生`;
        msg.style.color='#24465D'; msg.style.display='block';
        document.getElementById('quickNotifTitle').value='';
        document.getElementById('quickNotifBody').value='';
      } catch(e) { msg.textContent='網路錯誤'; msg.style.color='#e53935'; msg.style.display='block'; }
    }

    async function sendBroadcast2() {
      const user = getUser();
      const title = document.getElementById('broadcastTitle2')?.value.trim();
      const body  = document.getElementById('broadcastBody2')?.value.trim();
      const msg   = document.getElementById('broadcastMsg2');
      if (!title) { msg.textContent='請填寫廣播標題'; msg.style.color='#e53935'; msg.style.display='block'; return; }
      try {
        const res = await fetch('/api/notifications/send', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({sender_id:user.id, title, body:body||'', target:'all'})
        });
        const data = await res.json();
        if (!res.ok) { msg.textContent=data.detail||'發送失敗'; msg.style.color='#e53935'; msg.style.display='block'; return; }
        msg.textContent=`✅ 已廣播給 ${data.sent_to} 位使用者`;
        msg.style.color='#24465D'; msg.style.display='block';
        document.getElementById('broadcastTitle2').value='';
        document.getElementById('broadcastBody2').value='';
      } catch(e) { msg.textContent='網路錯誤'; msg.style.color='#e53935'; msg.style.display='block'; }
    }
  </script>
</body>
</html>
