<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的學習 - 客語隨拍隨學</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .word-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 16px 16px;
    }
    .word-date-group { margin-bottom: 8px; }
    .word-date-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 18px 18px 10px;
      color: #24465D;
      font-size: 15px;
      font-weight: 800;
    }
    .word-date-heading::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #E5E0D8;
    }
    .word-date-heading.today { color: #E88A4D; }
    .word-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .word-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    .word-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
    }
    .word-card-body { padding: 10px 12px 12px; }
    .word-card-hakka { font-size: 18px; font-weight: 800; color: #24465D; }
    .word-card-zh   { font-size: 12px; font-weight: 600; color: #888; margin: 2px 0 6px; }
    .word-card-sentence {
      font-size: 11px;
      color: #888;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .practice-btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 6px 0;
      background: #E8F2F7;
      color: #24465D;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .practice-btn:hover { background: #CFE1EA; }
    .photo-history-btn {
      width: 100%;
      margin-top: 8px;
      padding: 7px 8px;
      border: 1px solid #CFE1EA;
      border-radius: 8px;
      background: white;
      color: #315B78;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .photo-history-overlay {
      position: fixed;
      inset: 0;
      z-index: 600;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(20, 35, 43, 0.72);
    }
    .photo-history-sheet {
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 18px 16px max(28px, env(safe-area-inset-bottom));
      border-radius: 22px 22px 0 0;
      background: #F7F4EE;
      box-sizing: border-box;
    }
    .photo-history-header {
      position: sticky;
      top: -18px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -18px -16px 14px;
      padding: 16px;
      background: #F7F4EE;
      border-bottom: 1px solid #E5E0D8;
    }
    .photo-history-title {
      color: #24465D;
      font-size: 18px;
      font-weight: 800;
    }
    .photo-history-close {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #E8F2F7;
      color: #24465D;
      font-size: 20px;
      cursor: pointer;
    }
    .photo-history-list {
      display: grid;
      gap: 16px;
    }
    .photo-history-item {
      min-width: 0;
      overflow: hidden;
      border-radius: 16px;
      background: white;
      border: 1px solid #E5E0D8;
      box-shadow: 0 5px 18px rgba(36, 70, 93, 0.1);
    }
    .photo-history-item img {
      width: 100%;
      height: auto;
      max-height: 65vh;
      object-fit: contain;
      background: #17242B;
    }
    .photo-history-date {
      padding: 9px 10px;
      color: #6F7A80;
      font-size: 12px;
      line-height: 1.3;
      text-align: center;
    }
    .word-saved-time {
      margin-top: 5px;
      color: #7B858A;
      font-size: 11px;
      line-height: 1.3;
    }

    /* 刪除按鈕（卡片右上角） */
    .word-card { position: relative; }
    .delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 26px;
      height: 26px;
      background: rgba(0,0,0,0.45);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 13px;
      line-height: 26px;
      text-align: center;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .delete-btn:hover { background: rgba(211,47,47,0.85); }

    /* 刪除確認彈窗 */
    .confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .confirm-overlay.open { display: flex; }
    .confirm-box {
      background: white;
      border-radius: 16px;
      padding: 28px 24px 20px;
      width: 300px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .confirm-box .icon { font-size: 40px; margin-bottom: 10px; }
    .confirm-box h3 { font-size: 17px; font-weight: 700; color: #333; margin: 0 0 6px; }
    .confirm-box p  { font-size: 13px; color: #888; margin: 0 0 20px; }
    .confirm-btns { display: flex; gap: 10px; }
    .confirm-btns button { flex: 1; padding: 11px; border-radius: 10px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; }
    .btn-confirm-delete { background: #D32F2F; color: white; }
    .btn-confirm-delete:hover { background: #B71C1C; }
    .btn-confirm-cancel { background: #f0f0f0; color: #555; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }
    .empty-state .icon { font-size: 56px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    .loading-state {
      text-align: center;
      padding: 40px 20px;
      color: #aaa;
      font-size: 14px;
    }

    /* 詳細彈窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: white;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 480px;
      padding: 24px 20px 100px;
      animation: slideUp 0.25s ease;
      max-height: 85vh;
      overflow-y: auto;
      padding-bottom: max(100px, calc(80px + env(safe-area-inset-bottom)));
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    .modal-handle {
      width: 40px; height: 4px;
      background: #ddd;
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .modal-img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 16px;
      max-height: 220px;
      object-fit: cover;
    }
    .modal-hakka { font-size: 28px; color: #24465D; font-weight: 800; margin: 4px 0 4px; }
    .modal-zh    { font-size: 14px; font-weight: 400; color: #888; margin: 0 0 16px; }
    .modal-sentence-box {
      background: #FFF8E1;
      border-left: 4px solid #FFC107;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .modal-sentence-label { font-size: 11px; color: #999; margin-bottom: 4px; }
    .modal-sentence-text  { font-size: 14px; color: #555; line-height: 1.6; }
    .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
    .modal-actions button { flex: 1; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; }
    .btn-practice-modal { background: #315B78; color: white; }
    .btn-close-modal    { background: #f0f0f0; color: #555; }
    .btn-delete-modal   { background: #FFEBEE; color: #D32F2F; }
  </style>
  <link rel="stylesheet" href="/static/theme.css" />
</head>
<body>

  <div class="top-bar">
    <span style="font-size:22px;">📚</span>
    <h1>我的學習單字</h1>
  </div>
  <p style="font-size:13px;color:#888;padding:12px 16px 4px;">從拍照學習儲存的單字，點擊可進行語音練習</p>

  <div id="wordContainer">
    <div class="loading-state">載入中...</div>
  </div>

  <!-- 詳細彈窗 -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <img class="modal-img" id="modalImg" src="" alt="" />
      <div class="modal-hakka" id="modalHakka"></div>
      <div class="modal-zh"    id="modalZh"></div>
      <div class="modal-sentence-box" id="modalSentenceBox" style="display:none;">
        <div class="modal-sentence-label">💡 造句練習</div>
        <div class="modal-sentence-text" id="modalSentence"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-practice-modal" onclick="goToPractice()">🎤 語音練習</button>
        <button class="btn-delete-modal"   onclick="confirmDelete()">🗑️ 刪除</button>
        <button class="btn-close-modal"    onclick="closeModalDirect()">關閉</button>
      </div>
    </div>
  </div>

  <!-- 刪除確認彈窗 -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <div class="icon">🗑️</div>
      <h3>確定要刪除嗎？</h3>
      <p id="confirmText">刪除後無法復原</p>
      <div class="confirm-btns">
        <button class="btn-confirm-cancel" onclick="closeConfirm()">取消</button>
        <button class="btn-confirm-delete" onclick="doDelete()">確定刪除</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="/"><div class="nav-icon">🏠</div><div class="nav-label">首頁</div></a>
    <a class="nav-item" href="/recognition"><div class="nav-icon">📷</div><div class="nav-label">拍照學習</div></a>
    <a class="nav-item active" href="/learning"><div class="nav-icon">📚</div><div class="nav-label">我的學習</div></a>
    <a class="nav-item" href="/practice"><div class="nav-icon">🎤</div><div class="nav-label">語音練習</div></a>
    <a class="nav-item" href="/game"><div class="nav-icon">🎮</div><div class="nav-label">配對遊戲</div></a>
    <a class="nav-item" href="/record"><div class="nav-icon">📊</div><div class="nav-label">學習記錄</div></a>
    <a class="nav-item" href="/profile"><div class="nav-icon">👤</div><div class="nav-label">個人中心</div></a>
  </nav>

  <script src="/static/ui.js"></script>
  <script src="/static/auth.js"></script>
  <script src="/static/notif.js"></script>
  <script>
    requireLogin();
    initNotif();

    let selectedWord = null;

    async function loadMyWords() {
      const user = getUser();
      if (!user) return;

      try {
        const res = await fetch(`/api/saved_words/unique?user_id=${user.id}`);
        if (!res.ok) throw new Error();
        const unique = await res.json();

        const container = document.getElementById('wordContainer');

        if (unique.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="icon">📷</div>
              <p>還沒有收藏的詞彙，看到喜歡的詞就把它留下來吧！</p>
              <a href="/recognition" class="btn btn-primary" style="display:inline-flex;margin-top:16px;text-decoration:none;">📷 開始拍照</a>
            </div>
          `;
          return;
        }

        const localDateKey = value => {
          if (!value) return '';
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return '';
          const year = date.getFullYear();
          const month = String(date.getMonth() + 1).padStart(2, '0');
          const day = String(date.getDate()).padStart(2, '0');
          return `${year}-${month}-${day}`;
        };
        const todayKey = localDateKey(new Date().toISOString());
        const savedAtLabel = value => {
          const key = localDateKey(value);
          if (!key) return '較早儲存';
          const date = new Date(value);
          const hours = String(date.getHours()).padStart(2, '0');
          const minutes = String(date.getMinutes()).padStart(2, '0');
          const time = `${hours}:${minutes}`;
          if (key === todayKey) return `今天 ${time}`;
          const [year, month, day] = key.split('-').map(Number);
          return `${year}/${month}/${day} ${time}`;
        };
        const groups = new Map();
        unique
          .sort((a, b) => {
            if (!a.created_at && !b.created_at) return b.id - a.id;
            if (!a.created_at) return 1;
            if (!b.created_at) return -1;
            return new Date(b.created_at) - new Date(a.created_at);
          })
          .forEach(word => {
            const key = localDateKey(word.created_at);
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(word);
          });

        const createWordCard = w => {
          const card = document.createElement('div');
          card.className = 'word-card';
          const countBadge = (w.count && w.count > 1)
            ? `<div class="word-count-badge">×${w.count}</div>`
            : '';
          const sourceBadge = (w.source === 'ocr')
            ? `<div style="position:absolute;top:6px;left:6px;background:rgba(106,27,154,0.85);color:white;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;z-index:10;">🔤 OCR</div>`
            : '';
          const occurrences = Array.isArray(w.occurrences) && w.occurrences.length
            ? w.occurrences
            : [{ id: w.id, image_path: w.image_path, created_at: w.created_at }];
          const historyButtonHtml = occurrences.length > 1
            ? `<button type="button" class="photo-history-btn">展開全部 ${occurrences.length} 張照片</button>`
            : '';
          card.innerHTML = `
            ${w.source === 'ocr' ? sourceBadge : countBadge}
            <button class="delete-btn" title="刪除此單字">✕</button>
            <img src="${w.image_path}" alt="${w.label_zh}" onerror="this.src='';this.style.background='#f0f0f0';this.style.display='flex';this.insertAdjacentHTML('afterend','<div style=\'width:100%;aspect-ratio:4/3;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:32px;\'>🖼️</div>');this.remove();" />
            <div class="word-card-body">
              <div class="word-card-hakka">${w.label_hakka}</div>
              ${w.label_pinyin ? `<div class="word-card-pinyin" style="font-size:11px;margin:1px 0 3px;">${w.label_pinyin}</div>` : ''}
              <div class="word-card-zh" style="font-size:12px;font-weight:600;color:#888;">${w.label_zh}</div>
              <div class="word-saved-time">儲存於 ${savedAtLabel(w.created_at)}</div>
              ${w.sentence_zh ? `<div class="word-card-sentence">${w.sentence_zh}</div>` : ''}
              <button class="practice-btn">🎤 練習發音</button>
              ${historyButtonHtml}
            </div>
          `;
          // 刪除按鈕：阻止事件冒泡，避免觸發 openModal
          card.querySelector('.delete-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            confirmDeleteCard(w);
          });
          const historyButton = card.querySelector('.photo-history-btn');
          if (historyButton) {
            historyButton.addEventListener('click', (event) => {
              event.stopPropagation();
              const overlay = document.createElement('div');
              overlay.className = 'photo-history-overlay';
              overlay.innerHTML = `
                <div class="photo-history-sheet" role="dialog" aria-modal="true" aria-label="${w.label_zh}的全部照片">
                  <div class="photo-history-header">
                    <div class="photo-history-title">${w.label_hakka}・全部 ${occurrences.length} 張</div>
                    <button type="button" class="photo-history-close" aria-label="關閉">✕</button>
                  </div>
                  <div class="photo-history-list">
                    ${occurrences.map(photo => `
                      <div class="photo-history-item">
                        <img src="${photo.image_path}" alt="${w.label_zh}的拍攝紀錄" loading="lazy" />
                        <div class="photo-history-date">儲存於 ${savedAtLabel(photo.created_at)}</div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `;
              const close = () => {
                overlay.remove();
                document.body.style.overflow = '';
              };
              overlay.querySelector('.photo-history-close').addEventListener('click', close);
              overlay.addEventListener('click', event => {
                if (event.target === overlay) close();
              });
              document.body.appendChild(overlay);
              document.body.style.overflow = 'hidden';
            });
          }
          card.addEventListener('click', () => openModal(w));
          return card;
        };

        container.innerHTML = '';
        groups.forEach((words, dateKey) => {
          const section = document.createElement('section');
          section.className = 'word-date-group';
          const heading = document.createElement('h2');
          heading.className = `word-date-heading${dateKey === todayKey ? ' today' : ''}`;
          if (!dateKey) {
            heading.textContent = '較早儲存';
          } else if (dateKey === todayKey) {
            heading.textContent = `今天拍攝儲存・${words.length} 個`;
          } else {
            const [year, month, day] = dateKey.split('-').map(Number);
            heading.textContent = `${year} 年 ${month} 月 ${day} 日・${words.length} 個`;
          }
          const grid = document.createElement('div');
          grid.className = 'word-grid';
          words.forEach(word => grid.appendChild(createWordCard(word)));
          section.append(heading, grid);
          container.appendChild(section);
        });

      } catch (e) {
        document.getElementById('wordContainer').innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <p>目前暫時無法載入收藏，請稍後再試。</p>
          </div>
        `;
      }
    }

    function openModal(word) {
      selectedWord = word;
      document.getElementById('modalImg').src = word.image_path;
      document.getElementById('modalImg').style.display = word.image_path ? 'block' : 'none';
      document.getElementById('modalHakka').textContent = word.label_hakka;
      document.getElementById('modalZh').textContent    = word.label_zh ? `中文：${word.label_zh}` : '';
      // 拼音：插在客語下方
      let pinyinEl = document.getElementById('modalPinyin');
      if (!pinyinEl) {
        pinyinEl = document.createElement('div');
        pinyinEl.id = 'modalPinyin';
        pinyinEl.style.cssText = 'font-size:14px;margin:-8px 0 12px;';
        document.getElementById('modalHakka').insertAdjacentElement('afterend', pinyinEl);
      }
      pinyinEl.textContent = word.label_pinyin || '';

      const sentenceBox = document.getElementById('modalSentenceBox');
      const sentenceEl  = document.getElementById('modalSentence');
      if (word.sentence_zh) {
        sentenceEl.textContent = word.sentence_zh;
        sentenceBox.style.display = 'block';
      } else {
        sentenceBox.style.display = 'none';
      }

      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(e) {
      if (e.target === document.getElementById('modalOverlay')) {
        closeModalDirect();
      }
    }

    function closeModalDirect() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    function goToPractice() {
      if (!selectedWord) return;
      // 帶著單字跳到練習頁，練習頁會用 ?word= 參數載入對應題目
      window.location.href = `/practice?word=${encodeURIComponent(selectedWord.label_zh)}`;
    }

    // ── 刪除功能 ──────────────────────────────────────────
    let wordToDelete = null;

    // 從卡片右上角 ✕ 觸發（不開 modal）
    function confirmDeleteCard(word) {
      wordToDelete = word;
      document.getElementById('confirmText').textContent = `「${word.label_zh}」刪除後無法復原`;
      document.getElementById('confirmOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    // 從詳細 modal 內的刪除按鈕觸發
    function confirmDelete() {
      if (!selectedWord) return;
      wordToDelete = selectedWord;
      closeModalDirect();
      document.getElementById('confirmText').textContent = `「${selectedWord.label_zh}」刪除後無法復原`;
      document.getElementById('confirmOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeConfirm() {
      document.getElementById('confirmOverlay').classList.remove('open');
      document.body.style.overflow = '';
      wordToDelete = null;
    }

    async function doDelete() {
      if (!wordToDelete) return;
      const user = getUser();
      if (!user) return;

      try {
        const res = await fetch(`/api/saved_words/${wordToDelete.id}?user_id=${user.id}`, {
          method: 'DELETE'
        });
        if (!res.ok) {
          const err = await res.json();
          alert('刪除失敗：' + (err.detail || '未知錯誤'));
          return;
        }
        closeConfirm();
        // 重新載入單字列表
        await loadMyWords();
      } catch (e) {
        alert('刪除時發生錯誤，請稍後再試');
      }
    }

    loadMyWords();
  </script>
</body>
</html>
